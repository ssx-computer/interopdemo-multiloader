# Project
version=1.0.0
group=com.example.interopdemo
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Interop Demo
mod_author=SongShixuan
mod_id=interopdemo
license=MIT
credits=Based on the MultiLoader-Template by Jared
description=One codebase, two loaders: runs on both NeoForge and Fabric for Minecraft 1.21.1.
minecraft_version_range=[1.21.1, 1.22)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric
fabric_version=0.116.17+1.21.1
fabric_loader_version=0.16.9

# NeoForge
neoforge_version=21.1.80
neoforge_loader_version_range=[4,)

# Gradle
# The 'common' project compiles Minecraft via NeoForm (ModDevGradle/NFRT); the
# decompilation step needs a 6-8 GB heap on the machine — keep this at 2G and
# let Gradle/NFRT allocate more for that sub-process if needed.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.daemon=true
