pluginManagement {
    // The NeoForge maven can be redirected via the `neoforgeMaven` Gradle property
    // (handy for restricted networks, CI caches, offline mirrors). Defaults to upstream.
    def neoforgeMaven = providers.gradleProperty('neoforgeMaven')
            .getOrElse('https://maven.neoforged.net/releases')

    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        maven {
            name = 'NeoForge'
            url = uri(neoforgeMaven)
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'InteropDemo'
include('common')
include('fabric')
include('neoforge')
